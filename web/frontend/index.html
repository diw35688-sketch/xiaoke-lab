<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>实验助手工作台</title>
  <style>
    :root{--ink:#18212f;--muted:#697586;--line:#e6e9ef;--brand:#3b67e8;--bg:#f6f7fb;--card:#fff;--green:#0b8a6a;--shadow:0 12px 35px rgba(28,39,65,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif}.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}.sidebar{padding:28px 16px;background:#171c2b;color:#fff}.brand{display:flex;gap:10px;align-items:center;font-size:19px;font-weight:700;margin:0 10px 38px}.logo{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:#597cf0}.nav-label{margin:24px 10px 8px;color:#96a0ba;font-size:12px}.nav-item{width:100%;display:flex;gap:12px;align-items:center;border:0;border-radius:10px;padding:12px 10px;background:transparent;color:#d6dbeb;font:inherit;text-align:left;cursor:pointer}.nav-item.active,.nav-item:hover{background:#29334e;color:#fff}.nav-item span:first-child{width:20px;text-align:center}.sidebar-foot{position:fixed;bottom:26px;left:26px;color:#aab3c7;font-size:12px}.main{padding:30px;max-width:1540px;width:100%;margin:auto}.topbar{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:25px}.eyebrow{color:var(--brand);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.topbar h1{margin:5px 0 0;font-size:28px}.date{color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:minmax(520px,1.35fr) minmax(330px,.65fr);gap:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.calendar-card{padding:22px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.card h2{margin:0;font-size:17px}.sub{margin:5px 0 0;color:var(--muted);font-size:13px}.buttons{display:flex;gap:8px}.btn{height:36px;padding:0 13px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font:inherit;cursor:pointer}.btn.primary{border-color:var(--brand);background:var(--brand);color:#fff}.week{display:grid;grid-template-columns:repeat(7,minmax(88px,1fr));gap:8px;margin-top:22px;overflow-x:auto;padding-bottom:3px}.day{min-height:305px;border:1px solid var(--line);border-radius:12px;padding:10px 8px;background:#fbfcfe}.day.today{border:2px solid #9db1fb;background:#f5f7ff}.day-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:10px}.day-num{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;font-weight:700;color:var(--ink)}.today .day-num{background:var(--brand);color:#fff}.event{padding:8px;margin:6px 0;border-radius:8px;background:#e9efff;border-left:3px solid var(--brand);font-size:12px;line-height:1.45;cursor:default}.event.green{background:#e3f7f1;border-left-color:var(--green)}.event .time{display:block;color:#52627a;font-size:11px;margin-top:3px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:19px 0 0}.stat{padding:14px;border-radius:12px;background:#f8f9fc}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}.right{display:grid;gap:22px;align-content:start}.experiment-list{padding:20px;max-height:445px;overflow:auto}.list-item{padding:13px 0;border-bottom:1px solid var(--line)}.list-item:last-child{border:0}.list-title{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:700}.tag{white-space:nowrap;padding:3px 7px;border-radius:20px;background:#e8edff;color:#435bcc;font-size:11px;font-weight:500}.meta{margin-top:6px;color:var(--muted);font-size:12px;line-height:1.6}.empty{color:var(--muted);font-size:13px;padding:28px 0;text-align:center}.chat-card{overflow:hidden}.chat-head{padding:17px 20px;border-bottom:1px solid var(--line)}#chat{height:245px;overflow:auto;padding:14px 16px}.message{display:flex;margin:9px 0}.message.user{justify-content:flex-end}.bubble{max-width:86%;padding:9px 11px;border-radius:10px;line-height:1.55;font-size:13px;white-space:pre-wrap}.assistant .bubble{background:#f0f3fa}.user .bubble{background:var(--brand);color:#fff}.chat-form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}input,textarea{width:100%;border:1px solid #d9deea;border-radius:9px;padding:10px;font:inherit;color:var(--ink)}#message{min-width:0}.send{border:0;border-radius:9px;padding:0 13px;background:var(--brand);color:#fff;cursor:pointer}.mic{width:38px;border:1px solid #cfdaff;border-radius:9px;background:#eef3ff;color:#3158c8;cursor:pointer}.mic.listening{background:#d83b4a;color:white}.voice-row{display:flex;justify-content:space-between;align-items:center;padding:0 13px 11px;color:var(--muted);font-size:11px}.modal{position:fixed;inset:0;z-index:3;display:none;place-items:center;padding:16px;background:rgba(17,25,42,.48)}.modal.show{display:grid}.modal-box{width:min(540px,100%);padding:24px;background:#fff;border-radius:18px;box-shadow:0 25px 80px rgba(0,0,0,.2)}.modal-box h2{margin:0 0 18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px;font-size:13px;color:#475569}.field.wide{grid-column:1/-1}.field textarea{resize:vertical;min-height:65px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.notice{position:fixed;z-index:5;right:22px;bottom:22px;padding:12px 16px;border-radius:10px;background:#172033;color:#fff;box-shadow:var(--shadow);display:none}.notice.show{display:block}@media(max-width:1050px){.grid{grid-template-columns:1fr}.right{grid-template-columns:1fr 1fr}.chat-card{grid-column:span 1}}@media(max-width:720px){.app{display:block}.sidebar{display:none}.main{padding:20px 14px}.topbar{align-items:flex-start}.topbar h1{font-size:23px}.right{grid-template-columns:1fr}.week{grid-template-columns:repeat(7,105px)}.form-grid{grid-template-columns:1fr}.field.wide{grid-column:auto}.date{display:none}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar"><div class="brand"><span class="logo">⚗</span>实验助手</div><button class="nav-item active"><span>▦</span>实验工作台</button><button class="nav-item" onclick="document.querySelector('#chat-card').scrollIntoView({behavior:'smooth'})"><span>◌</span>智能对话</button><button class="nav-item" onclick="openModal()"><span>＋</span>新建实验</button><div class="nav-label">管理</div><button class="nav-item" onclick="loadExperiments()"><span>↻</span>刷新数据</button><div class="sidebar-foot">本地实验室 · v0.5</div></aside>
    <main class="main">
      <header class="topbar"><div><div class="eyebrow">LABORATORY OS</div><h1>实验工作台</h1></div><div class="date" id="today-text"></div></header>
      <section class="grid">
        <div class="card calendar-card"><div class="card-head"><div><h2>本周实验日历</h2><p class="sub" id="week-label">正在加载日期…</p></div><div class="buttons"><button class="btn" onclick="moveWeek(-1)">‹</button><button class="btn" onclick="goToday()">今天</button><button class="btn" onclick="moveWeek(1)">›</button><button class="btn primary" onclick="openModal()">＋ 新建实验</button></div></div><div class="week" id="week"></div><div class="stats"><div class="stat"><b id="total-count">0</b><span>实验总数</span></div><div class="stat"><b id="week-count">0</b><span>本周安排</span></div><div class="stat"><b id="equipment-count">0</b><span>涉及仪器</span></div></div></div>
        <div class="right"><section class="card experiment-list"><div class="card-head"><div><h2>实验清单</h2><p class="sub">按开始时间排序</p></div><button class="btn" onclick="loadExperiments()">刷新</button></div><div id="experiment-list"><p class="empty">正在读取实验数据…</p></div></section>
        <section class="card chat-card" id="chat-card"><div class="chat-head"><h2>实验助手对话</h2><p class="sub">可创建、查询实验，或进行计算</p></div><div id="chat"><div class="message assistant"><div class="bubble">你好！我可以帮你安排实验、查询实验记录、检查仪器时间冲突，也可以做计算。</div></div></div><form class="chat-form" id="form"><input id="message" placeholder="例如：帮我创建明天的 CCK-8 实验" required><button id="mic" class="mic" type="button" title="语音输入">◉</button><button id="send" class="send">发送</button></form><div class="voice-row"><label><input id="auto-speak" type="checkbox"> 自动朗读回复</label><span id="voice-status">语音功能就绪</span></div></section></div>
      </section>
    </main>
  </div>
  <div class="modal" id="modal"><form class="modal-box" id="experiment-form"><h2>新建实验</h2><div class="form-grid"><label class="field wide">实验名称<input name="name" required placeholder="例如：CCK-8 细胞活性检测"></label><label class="field">开始时间<input name="start_at" type="datetime-local"></label><label class="field">结束时间<input name="end_at" type="datetime-local"></label><label class="field">使用仪器<input name="equipment" placeholder="例如：酶标仪"></label><label class="field">实验目标<input name="goal" placeholder="例如：检测药物毒性"></label><label class="field wide">备注<textarea name="notes" placeholder="样品、注意事项或实验条件"></textarea></label></div><div class="modal-actions"><button class="btn" type="button" onclick="closeModal()">取消</button><button class="btn primary" id="save-experiment">保存实验</button></div></form></div><div class="notice" id="notice"></div>
  <script>
    const chat=document.querySelector('#chat'),form=document.querySelector('#form'),input=document.querySelector('#message'),send=document.querySelector('#send'),mic=document.querySelector('#mic'),autoSpeak=document.querySelector('#auto-speak'),status=document.querySelector('#voice-status');let experiments=[],viewDate=new Date(),recognition,listening=false;const weekNames=['日','一','二','三','四','五','六'];
    function localDate(date){return date.toISOString().slice(0,10)}function parseDate(value){if(!value)return null;const parsed=new Date(value);return Number.isNaN(parsed)?null:parsed}function notify(message){const el=document.querySelector('#notice');el.textContent=message;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3000)}function escapeHtml(value){const d=document.createElement('div');d.textContent=value||'';return d.innerHTML}
    function weekStart(date){const d=new Date(date);d.setHours(0,0,0,0);d.setDate(d.getDate()-d.getDay()+1);return d}function renderCalendar(){const start=weekStart(viewDate),today=localDate(new Date()),days=[];for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);days.push(d)}document.querySelector('#week-label').textContent=`${start.getMonth()+1} 月 ${start.getDate()} 日 — ${days[6].getMonth()+1} 月 ${days[6].getDate()} 日`;const grid=document.querySelector('#week');grid.innerHTML=days.map(d=>{const key=localDate(d),items=experiments.filter(e=>{const x=parseDate(e.start_at);return x&&localDate(x)===key});return `<article class="day ${key===today?'today':''}"><div class="day-top"><span>周${weekNames[d.getDay()]}</span><span class="day-num">${d.getDate()}</span></div>${items.map((e,i)=>`<div class="event ${i%2?'green':''}" title="${escapeHtml(e.notes)}"><b>${escapeHtml(e.name)}</b><span class="time">${e.start_at?new Date(e.start_at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):'未设置时间'}${e.equipment?' · '+escapeHtml(e.equipment):''}</span></div>`).join('')}</article>`}).join('');const end=new Date(start);end.setDate(start.getDate()+7);document.querySelector('#week-count').textContent=experiments.filter(e=>{const d=parseDate(e.start_at);return d&&d>=start&&d<end}).length}function renderList(){const root=document.querySelector('#experiment-list');if(!experiments.length){root.innerHTML='<p class="empty">还没有实验。点击“新建实验”开始安排吧。</p>';return}root.innerHTML=experiments.map(e=>`<article class="list-item"><div class="list-title"><span>${escapeHtml(e.name)}</span><span class="tag">${escapeHtml(e.equipment||'未指定仪器')}</span></div><div class="meta">${e.start_at?new Date(e.start_at).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'未安排时间'}${e.goal?' · '+escapeHtml(e.goal):''}</div></article>`).join('')}async function loadExperiments(){try{const r=await fetch('/experiments');if(!r.ok)throw Error('无法读取实验数据');experiments=await r.json();renderCalendar();renderList();document.querySelector('#total-count').textContent=experiments.length;document.querySelector('#equipment-count').textContent=new Set(experiments.map(e=>e.equipment).filter(Boolean)).size}catch(e){document.querySelector('#experiment-list').innerHTML='<p class="empty">读取失败，请确认服务正在运行。</p>';notify(e.message)}}function moveWeek(amount){viewDate.setDate(viewDate.getDate()+amount*7);renderCalendar()}function goToday(){viewDate=new Date();renderCalendar()}function openModal(){document.querySelector('#modal').classList.add('show')}function closeModal(){document.querySelector('#modal').classList.remove('show')}document.querySelector('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};document.querySelector('#experiment-form').onsubmit=async e=>{e.preventDefault();const button=document.querySelector('#save-experiment'),data=Object.fromEntries(new FormData(e.target));button.disabled=true;try{const r=await fetch('/experiments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),d=await r.json();if(!r.ok)throw Error(d.detail?.message||d.detail||'保存失败');notify('实验已保存');closeModal();e.target.reset();await loadExperiments();if(d.start_at)viewDate=parseDate(d.start_at)||viewDate;renderCalendar()}catch(err){notify(err.message)}finally{button.disabled=false}};
    function add(text,role){const row=document.createElement('div'),bubble=document.createElement('div');row.className=`message ${role}`;bubble.className='bubble';bubble.textContent=text;row.appendChild(bubble);chat.appendChild(row);chat.scrollTop=chat.scrollHeight;return bubble}function speak(text){if(!text||!window.speechSynthesis)return;window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang='zh-CN';utterance.onstart=()=>status.textContent='正在朗读回复…';utterance.onend=()=>status.textContent='朗读完成';window.speechSynthesis.speak(utterance)}const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(SpeechRecognition){recognition=new SpeechRecognition();recognition.lang='zh-CN';recognition.interimResults=true;recognition.onstart=()=>{listening=true;mic.classList.add('listening');status.textContent='正在聆听…'};recognition.onresult=e=>{let text='';for(let i=e.resultIndex;i<e.results.length;i++)text+=e.results[i][0].transcript;input.value=text};recognition.onerror=e=>status.textContent=`语音识别失败：${e.error}`;recognition.onend=()=>{listening=false;mic.classList.remove('listening');if(status.textContent==='正在聆听…')status.textContent='语音识别完成'}}else{mic.disabled=true;status.textContent='当前浏览器不支持语音识别'}mic.onclick=()=>listening?recognition.stop():recognition.start();form.onsubmit=async e=>{e.preventDefault();const message=input.value.trim();if(!message)return;if(listening)recognition.stop();window.speechSynthesis?.cancel();add(message,'user');input.value='';input.disabled=send.disabled=true;const reply=add('正在思考…','assistant');try{const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})}),d=await r.json();if(!r.ok)throw Error(d.detail||'请求失败');reply.textContent=d.answer;if(autoSpeak.checked)speak(d.answer);loadExperiments()}catch(err){reply.textContent=`出错了：${err.message}`}finally{input.disabled=send.disabled=false;input.focus()}};
    document.querySelector('#today-text').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});loadExperiments();
  </script>
  <script src="/static/inworld_tts.js"></script>
</body>
</html>
