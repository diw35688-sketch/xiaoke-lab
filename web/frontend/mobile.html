<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>语音实验助手</title>
  <style>
    :root{--brand:#3b67e8;--brand-strong:#2f54c9;--bg:#f6f7fb;--ink:#18212f;--muted:#697586;--card:#fff;--line:#e6e9ef;--red:#dc2626;--green:#0b8a6a}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;user-select:none}
    header{flex:0 0 auto;padding:18px 16px 12px;background:var(--card);border-bottom:1px solid var(--line)}
    header h1{margin:0;font-size:19px}
    #m-status{display:block;margin-top:4px;font-size:13px;color:var(--muted)}
    main{flex:1 1 auto;min-height:0;overflow-y:auto;padding:14px 14px 10px;-webkit-overflow-scrolling:touch}
    .bubble{margin:0 0 10px;padding:11px 14px;border-radius:16px;font-size:16px;line-height:1.6;white-space:pre-wrap;word-break:break-word;background:var(--card);border:1px solid var(--line);box-shadow:0 2px 8px rgba(28,39,65,.05)}
    .bubble.user{background:var(--brand);color:#fff;border-color:var(--brand);text-align:right}
    .bubble .tag{display:block;font-size:12px;opacity:.75;margin-bottom:3px}
    .bubble .sub{display:block;font-size:12.5px;opacity:.8;margin-top:6px}
    .bubble.warn{border-color:#f3c98b;background:#fff8ec}
    footer{flex:0 0 auto;padding:10px 16px calc(16px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);text-align:center}
    #m-hint{font-size:13px;color:var(--muted);margin-bottom:10px}
    #m-record-btn{width:78px;height:78px;border:0;border-radius:50%;background:var(--brand);color:#fff;font-size:34px;cursor:pointer;box-shadow:0 8px 20px rgba(59,103,232,.35);transition:transform .12s}
    #m-record-btn:active{transform:scale(.94)}
    #m-record-btn.rec{background:var(--red);box-shadow:0 8px 20px rgba(220,38,38,.35);animation:m-pulse 1.3s ease-in-out infinite}
    @keyframes m-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
    #m-record-btn:disabled{opacity:.5}
    .m-empty{color:var(--muted);font-size:14px;text-align:center;margin-top:40px;line-height:1.9}
  </style>
</head>
<body>
  <header>
    <h1>🎙 语音实验助手</h1>
    <span id="m-status">就绪</span>
  </header>
  <main id="m-log">
    <div class="m-empty" id="m-empty">点下方按钮开始口述<br>（如：将溶液加热到60摄氏度）</div>
  </main>
  <footer>
    <div id="m-hint">点击开始录音，说完再点一次</div>
    <button id="m-record-btn" type="button" aria-label="录音">🎤</button>
  </footer>
<script src="/static/local_tts.js?v=20260825-streaming-tts"></script>
<script src="/static/voice_delivery_client.js?v=20260825-client-result"></script>
<script src="/static/mobile.js?v=20260824-stream"></script>
</body>
</html>
